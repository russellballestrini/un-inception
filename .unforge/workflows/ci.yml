# Forgejo / GitHub Actions port of .gitlab-ci.yml.
#
# The gitlab original uses artifact-driven child pipelines:
#   generate-matrix produces test-matrix.yml -> trigger-test-matrix
#   fans it out as a parallel-matrix child pipeline (one SDK per entry).
#
# In Actions world that becomes:
#   - generate-matrix writes JSON to $GITHUB_OUTPUT.matrix
#     (see scripts/generate-matrix.sh — dual-emits for gitlab + Actions)
#   - test consumes via strategy.matrix.include: fromJson(...)
#   - the child pipeline's build / cleanup / test stages are now
#     stages of the parent workflow
#
# Both the gitlab and the Actions side keep working; the generator
# script is the single source of truth for "which SDKs to test."

name: ci

on:
  push:
    branches: [main]
    tags: ['*.*.*']        # closest glob equivalent of gitlab's /^\d+\.\d+\.\d+$/
  workflow_dispatch:        # for the "manual burn pool" path

jobs:

  # =====================================================================
  # STAGE 1: Detect Changes
  # =====================================================================
  detect-changes:
    runs-on: [self-hosted, build]
    outputs:
      changes_json: ${{ steps.detect.outputs.changes_json }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: detect
        run: |
          bash scripts/detect-changes.sh > changes.json
          cat changes.json
          # Re-export to GITHUB_OUTPUT for downstream jobs
          echo "changes_json=$(jq -c . changes.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: changes
          path: changes.json

  # =====================================================================
  # STAGE 2: Generate Dynamic Matrix
  # Produces both test-matrix.yml (gitlab child pipeline, unchanged) AND
  # $GITHUB_OUTPUT.matrix (JSON list for Actions matrix consumer).
  # =====================================================================
  generate-matrix:
    needs: detect-changes
    runs-on: [self-hosted, build]
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: changes
      - id: gen
        run: bash scripts/generate-matrix.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-matrix
          path: test-matrix.yml

  # =====================================================================
  # STAGE 3: Build CLI (was gitlab's `build:` job)
  # =====================================================================
  build:
    needs: generate-matrix
    runs-on: [self-hosted, build]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: bash scripts/build-clients.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build
          path: |
            build/

  # =====================================================================
  # STAGE 4: Cleanup orphaned test resources before fan-out
  # (was a job inside the gitlab child pipeline; promoted here)
  # =====================================================================
  cleanup-services:
    needs: build
    runs-on: [self-hosted, build]
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build
          path: .
      - run: bash scripts/cleanup-test-resources.sh

  # =====================================================================
  # STAGE 5: Test fan-out (was gitlab's child-pipeline `test:` matrix)
  # Drives one parallel job per SDK_LANG fed from generate-matrix.
  # =====================================================================
  test:
    needs: [generate-matrix, build, cleanup-services]
    runs-on: [self-hosted, build]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    continue-on-error: true        # gitlab's `allow_failure: true`
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build
          path: .
      - run: bash scripts/test-sdk.sh "${{ matrix.SDK_LANG }}"
        env:
          SDK_LANG: ${{ matrix.SDK_LANG }}
          UNSANDBOX_PUBLIC_KEY: ${{ secrets.UNSANDBOX_PUBLIC_KEY }}
          UNSANDBOX_SECRET_KEY: ${{ secrets.UNSANDBOX_SECRET_KEY }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: test-results-${{ matrix.SDK_LANG }}
          path: test-results-${{ matrix.SDK_LANG }}/

  # =====================================================================
  # MANUAL POOL BURN — same matrix machinery, triggered manually
  # =====================================================================
  manual-burn-pool:
    runs-on: [self-hosted, build]
    if: ${{ github.event_name == 'workflow_dispatch' }}
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: |
          echo "=== MANUAL POOL BURN ==="
          echo '{"test_all": true, "changed_langs": []}' > changes.json
      - id: gen
        env:
          FORCE_FULL_MATRIX: 'true'
        run: bash scripts/generate-matrix.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-matrix-burn
          path: test-matrix.yml

  manual-burn-pool-test:
    needs: manual-burn-pool
    runs-on: [self-hosted, build]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.manual-burn-pool.outputs.matrix) }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: bash scripts/build-clients.sh
      - run: bash scripts/test-sdk.sh "${{ matrix.SDK_LANG }}"
        env:
          UNSANDBOX_PUBLIC_KEY: ${{ secrets.UNSANDBOX_PUBLIC_KEY }}
          UNSANDBOX_SECRET_KEY: ${{ secrets.UNSANDBOX_SECRET_KEY }}

  # =====================================================================
  # SCIENCE / pool-metric / perf jobs — flatten as-is from gitlab side
  # =====================================================================
  science-validate-examples:
    needs: build
    runs-on: [self-hosted, build]
    container: python:3.11
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --quiet --require-hashes -r requirements-pip.lock
          pip install --quiet --require-hashes -r requirements-ci.lock
          bash scripts/validate-examples.sh
        env:
          UNSANDBOX_PUBLIC_KEY: ${{ secrets.UNSANDBOX_PUBLIC_KEY }}
          UNSANDBOX_SECRET_KEY: ${{ secrets.UNSANDBOX_SECRET_KEY }}

  collect-pool-metrics:
    needs: test
    runs-on: [self-hosted, build]
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: bash scripts/collect-pool-metrics.sh

  perf-report:
    needs: collect-pool-metrics
    runs-on: [self-hosted, build]
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: bash scripts/generate-perf-report.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: perf-report
          path: perf-results/
